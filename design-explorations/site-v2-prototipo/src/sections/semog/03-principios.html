<!-- Princípios · os três nomes são os três gradientes do rebrand, e cada princípio mora no
     seu: Retidão no marinho chapado (que a história entrega), Transparência na descida do
     marinho ao gelo, Dinâmica no mesh vivo, branco dominante. É uma superfície contínua,
     sem borda entre um mundo e outro; um fio de ponta reta desce pela margem e liga os três. -->
<section id="principios" class="cena" data-tema="marinho" aria-labelledby="principios-titulo">
  <!-- TEXTO-NOVO -->
  <h2 id="principios-titulo" class="sr-only">Princípios da Semog</h2>
  <div class="pr-fio" aria-hidden="true"><span class="pr-fio-traco"></span></div>

  <article class="pr-zona pr-zona--retidao" data-tema="marinho" aria-labelledby="pr-retidao">
    <div class="container pr-conteudo">
      <span class="pr-no" aria-hidden="true"></span>
      <h3 id="pr-retidao" class="pr-nome">{{aSemog.principios.0.titulo}}</h3>
      <p class="pr-texto">{{aSemog.principios.0.texto}}</p>
    </div>
  </article>

  <article
    class="pr-zona pr-zona--transparencia"
    data-tema="gelo"
    aria-labelledby="pr-transparencia"
  >
    <div class="container pr-conteudo">
      <span class="pr-no" aria-hidden="true"></span>
      <h3 id="pr-transparencia" class="pr-nome">{{aSemog.principios.1.titulo}}</h3>
      <p class="pr-texto">{{aSemog.principios.1.texto}}</p>
    </div>
  </article>

  <article class="pr-zona pr-zona--dinamica" data-tema="claro" aria-labelledby="pr-dinamica">
    <canvas class="pr-mesh" aria-hidden="true"></canvas>
    <div class="container pr-conteudo">
      <span class="pr-no" aria-hidden="true"></span>
      <h3 id="pr-dinamica" class="pr-nome">{{aSemog.principios.2.titulo}}</h3>
      <p class="pr-texto">{{aSemog.principios.2.texto}}</p>
    </div>
  </article>
</section>

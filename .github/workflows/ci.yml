name: CI

on:
  push:
  pull_request:

jobs:
  lint-typecheck:
    name: Lint, typecheck & testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Versão do pnpm vem do campo `packageManager` do package.json
      # (pnpm@10.12.4). NÃO declarar `version:` aqui — os dois juntos causam
      # ERR_PNPM_BAD_PM_VERSION ("multiple versions of pnpm specified").
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm v10 skips build/postinstall scripts for deps not listed in
      # pnpm.onlyBuiltDependencies (package.json) — e.g. @sentry/cli. This only
      # prints an "Ignored build scripts" warning, it does not prompt or fail,
      # so --frozen-lockfile is safe to run unattended in CI.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NÃO usar `pnpm check` aqui: o script roda `biome check --write`, que
      # REESCREVE arquivos em vez de só verificar — no CI isso nunca falha
      # por drift de lint/format (só corrige e segue) e ainda deixa o
      # checkout do runner mutado. `biome ci` é o modo read-only do Biome,
      # feito pra pipeline: falha (exit != 0) se houver qualquer violação,
      # sem tocar em nada. O script `check` continua como está — é o fixer
      # que os devs rodam localmente.
      - name: Biome check
        run: pnpm exec biome ci ./src ./tests ./scripts

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      # Os testes de integração rodam em jsdom, sem banco — cobrem os tipos e a
      # lógica pura (sequenciador de vídeo do hero, camada de conteúdo, forms).
      # Rodam em qualquer ambiente, então entram no CI sem infraestrutura extra.
      # (O antigo passo "Payload generate:types (drift check)" saiu com a
      # remoção do Payload — os tipos de bloco agora são escritos à mão em
      # `src/types/`, não gerados.)
      - name: Testes de integração
        env:
          NODE_OPTIONS: --no-deprecation
        run: pnpm exec vitest run --config ./vitest.config.mts

      # `next build` is intentionally NOT run in this workflow: it fetches
      # data from Payload/Postgres at build time for the site's pages, and
      # CI has no live database available. Build verification happens via
      # the preview/deploy pipeline instead.
